# Builds on every pull request and push to main; packages and drafts a GitHub Release when a
# version tag (v*) is pushed. All the build logic lives in tools/ci/*.sh so it can be run
# by hand on any Ubuntu/WSL machine. No game data is used or produced anywhere in here.
name: build-and-release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # Naming only; R1.2 puts the real version inside the program.
  PKG_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}

jobs:
  repo-check:
    name: No ROMs, archives or binaries in the repository
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/ci/check_repo.py --self-test
      - run: python3 tools/ci/check_repo.py

  linux:
    name: Linux ${{ matrix.arch }} (build, ROM-free Lua tests, package)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04       # oldest current runner: keeps the glibc requirement low
          - arch: arm64
            runner: ubuntu-22.04-arm   # R4.2: native ARM64, the same tests
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # tags, for the version string

      - name: Build tools and SDL2 development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential zip \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev libgl-dev \
            xvfb libgl1-mesa-dri

      - name: Cache SDL2 (pinned 2.30.9, built from the checked source tarball)
        uses: actions/cache@v4
        with:
          path: deps/sdl2linux
          key: sdl2-linux-${{ matrix.arch }}-${{ hashFiles('tools/ci/fetch_sdl.sh') }}

      - name: Fetch SDL2
        run: tools/ci/fetch_sdl.sh linux deps/sdl2linux

      - name: Build libcore, liblua, modtest, luatest and the app
        run: tools/ci/build_all.sh linux deps/sdl2linux build/NBAJamRecomp-linux

      - name: Lua engine tests (no ROM needed)
        run: |
          set -o pipefail
          build/linux/luatest | tee luatest.log
          grep -q ", 0 failed" luatest.log

      - name: Lua gives the same results on every build (R5.4, no ROM needed)
        run: build/linux/luadet

      - name: Data folder tests (no ROM needed)
        run: |
          set -o pipefail
          build/linux/pathtest | tee pathtest.log
          grep -q ", 0 failed" pathtest.log

      - name: Release news tests (no network needed)
        run: |
          set -o pipefail
          build/linux/newstest | tee newstest.log
          grep -q ", 0 failed" newstest.log

      - name: Router tests (codes, STUN, UPnP, hole punching; no network needed)
        run: |
          set -o pipefail
          build/linux/nattest | tee nattest.log
          grep -q ", 0 failed" nattest.log

      - name: Menu toolkit tests (no display needed)
        run: |
          set -o pipefail
          mkdir -p viewtest-out
          build/linux/uitest viewtest-out | tee uitest.log
          grep -q ", 0 failed" uitest.log
          build/linux/touchtest viewtest-out | tee touchtest.log
          grep -q ", 0 failed" touchtest.log

      - name: ROM art reader tests (no ROM needed)
        run: |
          set -o pipefail
          build/linux/arttest viewtest-out | tee arttest.log
          grep -q ", 0 failed" arttest.log

      - name: Picture placement tests (no display needed)
        run: |
          set -o pipefail
          build/linux/viewtest --rects | tee viewtest.log
          grep -q ", 0 failed" viewtest.log

      - name: Presenter on a test pattern at every listed resolution (Xvfb, software OpenGL)
        run: |
          set -o pipefail
          mkdir -p viewtest-out
          for what in all shaders fills gallery; do
            xvfb-run -a -s "-screen 0 5120x2160x24" build/linux/viewtest --$what viewtest-out | tee viewtest-$what.log
            grep -q ", 0 failed" viewtest-$what.log
          done

      - uses: actions/upload-artifact@v4
        with:
          name: test-viewtest-screenshots-${{ matrix.arch }}
          path: viewtest-out/*.png
          if-no-files-found: error

      - name: Version string matches the tag
        run: |
          got=$(build/NBAJamRecomp-linux --version)
          echo "program says: $got"
          if [ "${{ github.ref_type }}" = tag ]; then
            want="${{ github.ref_name }}"; want="${want#v}"
            [ "$got" = "$want" ] || { echo "expected $want"; exit 1; }
          fi

      - name: Package
        run: tools/ci/package.sh linux build/NBAJamRecomp-linux "NBAJamRecomp-${PKG_VERSION}-linux-${{ matrix.arch }}" dist-out

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist-out/*
          if-no-files-found: error

  android:
    # R7.1: a debug APK (arm64-v8a, plus x86_64 for the emulator), started on an emulator
    name: Android (APK, started on an emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Restore Gradle downloads (fewer requests to Maven Central)
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('tools/ci/fetch_sdl.sh', 'tools/ci/android_build.sh') }}
          restore-keys: gradle-android-
      - name: Fetch SDL2 source
        run: tools/ci/fetch_sdl.sh android deps/sdl2src
      - name: Build the APK
        run: tools/ci/android_build.sh deps/sdl2src dist-android
      - name: Save Gradle downloads (as soon as the APK builds, whatever the tests do)
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('tools/ci/fetch_sdl.sh', 'tools/ci/android_build.sh') }}
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install and start on an emulator (API 30, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: tools/ci/android_emu_test.sh dist-android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-android-output
          path: |
            dist-android/*.apk
            android-shots/
            android-logcat*.txt

  macos:
    # R6.1: one universal program (Apple Silicon and Intel), built and tested on each processor
    name: macOS ${{ matrix.arch }} (universal build, ROM-free tests, launch)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache SDL2 (pinned 2.30.9, universal, built from the checked source tarball)
        uses: actions/cache@v4
        with:
          path: deps/sdl2mac
          key: sdl2-mac-${{ hashFiles('tools/ci/fetch_sdl.sh') }}

      - name: Fetch SDL2
        run: tools/ci/fetch_sdl.sh mac deps/sdl2mac

      - name: Build (arm64 + x86_64 in one file) and the tests
        run: |
          brew list make >/dev/null 2>&1 || brew install make
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          tools/ci/build_all.sh mac deps/sdl2mac build/NBAJamRecomp-mac
          lipo -archs build/NBAJamRecomp-mac | grep -q "arm64" && lipo -archs build/NBAJamRecomp-mac | grep -q "x86_64"

      - name: ROM-free tests (this runner's processor)
        run: |
          set -o pipefail
          for t in luatest pathtest; do build/mac/$t | tee $t.log; grep -q ", 0 failed" $t.log; done
          build/mac/luadet
          mkdir -p viewtest-out
          build/mac/uitest viewtest-out | tee uitest.log; grep -q ", 0 failed" uitest.log
          build/mac/touchtest viewtest-out | tee touchtest.log; grep -q ", 0 failed" touchtest.log
          build/mac/arttest viewtest-out | tee arttest.log; grep -q ", 0 failed" arttest.log
          build/mac/viewtest --rects | tee rects.log; grep -q ", 0 failed" rects.log
          # R6.4: netplay over loopback (STUN, punching, UPnP/PCP/NAT-PMP against fakes) and the router found with sysctl
          # nattest's fake routers use 127.0.1.x and 127.0.2.x; macOS only has 127.0.0.1 on lo0
          for i in $(seq 1 20); do sudo ifconfig lo0 alias 127.0.1.$i up; done
          for i in $(seq 1 5); do sudo ifconfig lo0 alias 127.0.2.$i up; done
          NATTEST_EXPECT_GATEWAY=1 build/mac/nattest | tee nattest.log; grep -q ", 0 failed" nattest.log

      - name: Presenter on a test pattern (OpenGL in a window)
        run: |
          set -o pipefail
          for what in all shaders; do build/mac/viewtest --$what viewtest-out | tee viewtest-$what.log; grep -q ", 0 failed" viewtest-$what.log; done

      - name: The universal program starts and renders (audit A, no ROMs)
        run: |
          set -o pipefail
          build/NBAJamRecomp-mac --version
          arch -${{ matrix.arch }} true
          mkdir -p audit-data
          NBAJAM_DATA_DIR="$PWD/audit-data" SDL_AUDIODRIVER=dummy perl -e 'alarm shift; exec @ARGV' 600 arch -${{ matrix.arch }} build/NBAJamRecomp-mac --pad-script tools/audit/a_noroms.pad > audit.log 2>&1 || true
          grep -aE "pad script|FAIL" audit.log
          ! grep -aq "FAIL" audit.log
          grep -aq "pad script" audit.log

      - name: App bundle (R6.2)
        run: |
          brew list librsvg >/dev/null 2>&1 || brew install librsvg
          mkdir -p dist-out
          tools/ci/mac_bundle.sh build/NBAJamRecomp-mac "$(build/NBAJamRecomp-mac --version)" dist-out
          plutil -p "dist-out/NBA JAM Recomp.app/Contents/Info.plist" | grep -E "Identifier|ShortVersion|HighResolution"
          ls -la "dist-out/NBA JAM Recomp.app/Contents/Resources"

      - name: The app as a user starts it (data in Application Support, screenshots)
        run: |
          set -o pipefail
          data="$HOME/Library/Application Support/NBAJamRecomp"
          rm -rf "$data"; mkdir -p shots
          app="dist-out/NBA JAM Recomp.app/Contents/MacOS/NBAJamRecomp"
          SDL_AUDIODRIVER=dummy "$app" --pad-script tools/audit/a_noroms.pad > bundle.log 2>&1 &
          pid=$!
          sleep 7; screencapture -x shots/desktop-menu.png || true
          sleep 6; screencapture -x shots/desktop-settings.png || true
          wait $pid || true
          grep -aE "pad script|FAIL" bundle.log
          ! grep -aq "FAIL" bundle.log
          grep -aq "line 50: PASS" bundle.log
          echo "data folder: $data"; ls "$data"
          n=$(find "$data/mods" -name '*.lua' | wc -l); echo "$n shipped scripts copied"; [ "$n" -gt 10 ]
          cp "$data"/screenshots/*.png shots/ 2>/dev/null || true; ls shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-macos-${{ matrix.arch }}-output
          path: |
            viewtest-out/*.png
            audit.log
            bundle.log
            shots/*.png
          if-no-files-found: ignore

      - name: Disk image (R6.3)
        if: matrix.arch == 'arm64'
        run: tools/ci/mac_dmg.sh "dist-out/NBA JAM Recomp.app" "dist-out/NBAJamRecomp-${PKG_VERSION}-macos-universal.dmg"

      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64'
        with:
          name: macos-universal-dmg
          path: dist-out/*.dmg
          if-no-files-found: error

  macos-dmg:
    # R6.3: the disk image on runners that did not build it, as a user would install it
    name: macOS disk image on a clean ${{ matrix.arch }} runner (mount, drag to Applications, start)
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4      # only for the audit script

      - uses: actions/download-artifact@v4
        with:
          name: macos-universal-dmg
          path: dmg

      - name: Mount, copy to Applications, start
        run: |
          set -o pipefail
          img=$(ls dmg/*.dmg); echo "$img"
          mnt=$(hdiutil attach -nobrowse -readonly "$img" | tail -1 | awk -F'	' '{print $NF}')
          echo "mounted at $mnt"; ls -la "$mnt"
          [ -L "$mnt/Applications" ] && [ -f "$mnt/First start - read me.txt" ]
          cp -R "$mnt/NBA JAM Recomp.app" /Applications/
          hdiutil detach "$mnt"
          app="/Applications/NBA JAM Recomp.app"
          codesign --verify --strict --verbose=2 "$app"
          lipo -archs "$app/Contents/MacOS/NBAJamRecomp"
          "$app/Contents/MacOS/NBAJamRecomp" --version
          rm -rf "$HOME/Library/Application Support/NBAJamRecomp"
          SDL_AUDIODRIVER=dummy perl -e 'alarm shift; exec @ARGV' 600 "$app/Contents/MacOS/NBAJamRecomp" --pad-script tools/audit/a_noroms.pad > run.log 2>&1 || true
          grep -aE "pad script|FAIL" run.log
          ! grep -aq "FAIL" run.log
          grep -aq "line 50: PASS" run.log
          n=$(find "$HOME/Library/Application Support/NBAJamRecomp/mods" -name '*.lua' | wc -l); echo "$n shipped scripts copied"; [ "$n" -gt 10 ]

  windows:
    name: Windows x64 (cross-build, package)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # tags, for the version string

      - name: Install the MinGW-w64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential mingw-w64 zip

      - name: Cache SDL2 (pinned 2.30.9, official MinGW package)
        uses: actions/cache@v4
        with:
          path: deps/sdl2win
          key: sdl2-win-${{ hashFiles('tools/ci/fetch_sdl.sh') }}

      - name: Fetch SDL2
        run: tools/ci/fetch_sdl.sh win deps/sdl2win

      - name: Build libcore, liblua and NBAJamRecomp.exe
        run: tools/ci/build_all.sh win deps/sdl2win build/NBAJamRecomp.exe

      - name: Version string is in the executable
        run: |
          want=$(make -s print-version)
          echo "expecting: $want"
          strings build/NBAJamRecomp.exe | grep -Fx -- "$want"

      - name: Package
        run: tools/ci/package.sh windows build/NBAJamRecomp.exe "NBAJamRecomp-${PKG_VERSION}-windows-x64" dist-out

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist-out/*
          if-no-files-found: error

  windows-installer:
    name: Windows installer (Inno Setup; silent install and uninstall)
    needs: windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: pkg

      - name: Build the installer
        shell: pwsh
        run: |
          $zip = Get-ChildItem pkg/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath stage
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DAppVer=$env:PKG_VERSION" "/DSrc=$PWD\stage\NBAJamRecomp" "/O$PWD\setup-out" tools\installer\NBAJamRecomp.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Get-ChildItem setup-out

      - name: Silent install, check, uninstall (data kept), install again, uninstall with /PURGE
        shell: pwsh
        run: tools/installer/test_installer.ps1 (Get-ChildItem setup-out/*.exe | Select-Object -First 1).FullName

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-setup
          path: setup-out/*.exe
          if-no-files-found: error

  linux-appimage:
    name: Linux AppImage (${{ matrix.appimage }}; runs in ${{ matrix.distros_name }})
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            appimage: x86_64
            runner: ubuntu-22.04
            distros: ubuntu:24.04 debian:12 fedora:41 archlinux:latest
            distros_name: Ubuntu, Debian, Fedora and Arch
          - arch: arm64
            appimage: aarch64
            runner: ubuntu-22.04-arm
            distros: ubuntu:24.04 debian:12 fedora:41      # no official Arch image for ARM
            distros_name: Ubuntu, Debian and Fedora
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: pkg

      - name: Build the AppImage
        run: |
          mkdir stage && tar -xzf pkg/*.tar.gz -C stage
          tools/ci/appimage.sh ${{ matrix.appimage }} stage/NBAJamRecomp "out/NBAJamRecomp-${PKG_VERSION}-linux-${{ matrix.appimage }}.AppImage"

      - name: Runs in four distribution containers (audit A under Xvfb)
        run: |
          img=$(ls out/*.AppImage)
          for d in ${{ matrix.distros }}; do
            docker run --rm -v "$PWD:/w" -w /w "$d" bash tools/ci/test_appimage.sh "$img" || exit 1
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.appimage }}-appimage
          path: out/*.AppImage
          if-no-files-found: error

  flatpak:
    name: Linux Flatpak (x86_64; built from source, tested in the sandbox)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # tags, for the version string

      - name: Flatpak tools, Flathub, the runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder xvfb xauth appstream elfutils librsvg2-common
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08 org.freedesktop.Platform.GL.default//26.08

      - name: AppStream metadata is valid
        run: appstreamcli validate --no-net --explain dist/linux/io.github.richvam.NBA_JAMs_Recomp.metainfo.xml

      - name: Build and install
        run: |
          make -s print-version > .flatpak-version
          echo "version: $(cat .flatpak-version)"
          flatpak-builder --user --install --force-clean --repo=fp-repo fp-build flatpak/io.github.richvam.NBA_JAMs_Recomp.yml
          mkdir -p out
          flatpak build-bundle fp-repo "out/NBAJamRecomp-${PKG_VERSION}-linux-x86_64.flatpak" io.github.richvam.NBA_JAMs_Recomp --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          ls -la out

      - name: Flathub's linter on the submission manifest and the metadata (report)
        continue-on-error: true
        run: |
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
          python3 tools/flathub/make_manifest.py --self-test
          python3 tools/flathub/make_manifest.py HEAD io.github.richvam.NBA_JAMs_Recomp.yml
          lint() { flatpak run --command=flatpak-builder-lint org.flatpak.Builder "$@" || true; }
          echo "== manifest"; lint manifest io.github.richvam.NBA_JAMs_Recomp.yml
          echo "== appstream"; lint appstream dist/linux/io.github.richvam.NBA_JAMs_Recomp.metainfo.xml
          echo "== repo"; lint repo fp-repo

      - name: Runs in the sandbox (audit A under Xvfb)
        run: bash tools/ci/test_flatpak.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-flatpak
          path: out/*.flatpak
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    if: github.ref_type == 'tag'
    needs: [repo-check, linux, windows, windows-installer, linux-appimage, flatpak, macos, macos-dmg]
    runs-on: ubuntu-22.04
    permissions:
      contents: write          # create the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # tags, to find the previous version

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Only the packages (test-* artifacts are test output, not for the release)
        run: |
          mkdir -p assets
          for d in artifacts/*/; do case $(basename "$d") in test-*) ;; *) cp "$d"* assets/ ;; esac; done
          ls -la assets

      - name: Release page from the changelog
        run: |
          python3 tools/ci/release_notes.py --self-test
          python3 tools/ci/release_notes.py notes "${{ github.ref_name }}" -o release-notes.md
          cat release-notes.md

      - name: Checksums
        working-directory: assets
        run: sha256sum * | tee SHA256SUMS.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" assets/* \
            --repo "${{ github.repository }}" --draft --verify-tag \
            --title "NBA JAM Recomp ${{ github.ref_name }}" \
            --notes-file release-notes.md
